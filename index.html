<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Security Headers -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    
    
    
    <!-- Open Graph / Twitter images (per-page title/description/canonical come from Helmet) -->
    <meta property="og:image" content="https://media.publit.io/file/projectassets/ecode-preview-banner.png" />
    <meta property="og:site_name" content="E-Code Halal Check" />
    
    <meta name="twitter:image" content="https://media.publit.io/file/projectassets/ecode-preview-banner.png" />
    
    <!-- Self-hosted Inter (latin, variable weight): no third-party font chain -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA metadata -->
    <meta name="theme-color" content="#10b981" />
    <meta name="application-name" content="E-Code Halal Check" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Code Halal Check" />
    

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Inline critical CSS for faster rendering */
      @font-face {
        font-family: "InterVariable";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/inter-latin-wght-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      body {
        font-family: "InterVariable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
        width: 100%;
      }
      
      /* Prevent horizontal overflow on mobile */
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
      }
    </style>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8TX0083FRY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8TX0083FRY');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              // ServiceWorker registered successfully
            })
            .catch(err => {
              // ServiceWorker registration failed
            });
        });
      }
    </script>
  </body>
</html>
